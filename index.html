<!DOCTYPE html>
<html lang="en">
<head> 
    <title> worst game</title>
    <style>
  /* 1. Square */
  .square {
    width: 100px;
    height: 100px;
    background-color: #3498db;
  }

  /* 2. Circle */
  .circle {
    width: 100px;
    height: 100px;
    background-color: #e74c3c;
    border-radius: 50%; 
  }

  /* 3. Triangle */
  .triangle {
    width: 0;
    height: 0;
    border-left: 50px solid transparent;
    border-right: 50px solid transparent;
    border-bottom: 100px solid #2ecc71;
  }
</style>

</head>
<body>
    <h1 id="title">Welcome to the worst game!</h1>
    <button id="myButton">Start</button>

    <!-- Connects JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
